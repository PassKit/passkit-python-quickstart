[build-system]
requires = [
  "setuptools>=82.0.1,<83; python_version < '3.10'",
  "setuptools>=84.0.0; python_version >= '3.10'",
]
build-backend = "setuptools.build_meta"

[project]
name = "passkit-python-quickstart"
version = "1.0.0"
description = "Runnable examples for the PassKit Python gRPC SDK"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "cryptography>=50.0.1,<51",
  "passkit-python-grpc-sdk==1.1.162",
  "python-dotenv>=1.1,<2",
]

[project.optional-dependencies]
dev = ["ruff>=0.13,<1"]

[project.scripts]
passkit-quickstart = "main:main"

[tool.setuptools]
packages = [
  "coupons",
  "event_tickets",
  "flights",
  "membership",
  "quickstarts",
  "quickstarts.workflows",
]
py-modules = ["main"]

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [
  "constants.py",
  "coupons",
  "flights",
  "membership",
  "quickstart-all.py",
  "shared",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
